name: Build Stock GameNative 1.2.0 Driver

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-driver.yml'
      - 'src/**'
      - 'tests/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: stock-gamenative-driver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wrapper:
    name: GameNative 1.2.0 / ARM64 wrapper ICD
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout ExynosTools
        uses: actions/checkout@v4
        with:
          path: exynostools

      - name: Verify stock GameNative 1.2.0 import contract
        run: |
          curl -fsSL https://raw.githubusercontent.com/utkarshdalal/GameNative/v1.2.0/app/src/main/java/com/winlator/contents/AdrenotoolsManager.java -o /tmp/AdrenotoolsManager.java
          grep -q 'new File(tmpDir, "meta.json")' /tmp/AdrenotoolsManager.java
          grep -q 'getString("libraryName")' /tmp/AdrenotoolsManager.java
          grep -q 'ADRENOTOOLS_DRIVER_NAME' /tmp/AdrenotoolsManager.java

      - name: Clone GameNative wrapper base
        run: |
          git clone --depth 1 --branch gn_wrapper2 https://github.com/leegao/mesa-wrapper-CI.git wrapper-src
          git -C wrapper-src rev-parse HEAD | tee wrapper-base.sha

      - name: Apply upstream Android build fixes
        working-directory: wrapper-src
        run: |
          sed -i 's/#if defined(HAVE_MEMFD_CREATE) \&\& !defined __TERMUX__/#if defined(HAVE_MEMFD_CREATE)/' src/util/anon_file.c
          sed -i "s/dep_libudev = dependency('libudev', required : false)/dep_libudev = null_dep/g" meson.build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mako PyYAML meson ninja packaging

      - name: Generate Android cross file
        working-directory: wrapper-src
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export MESON_WORKING_DIR="$PWD"
          envsubst < android.toml > android-cross.toml
          CLANG_VER=$(basename "$(ls -d "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/linux-x86_64/lib/clang/* | sort -V | tail -1)")
          sed -i "s|lib/clang/18|lib/clang/$CLANG_VER|g" android-cross.toml

      - name: Configure wrapper ICD
        working-directory: wrapper-src
        run: |
          meson setup _build \
            --cross-file android-cross.toml \
            -Dbuildtype=release \
            -Dplatforms=android,x11 \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dplatform-sdk-version=30 \
            -Dglx=disabled -Dgbm=disabled -Degl=disabled \
            -Dopengl=false -Dgles1=disabled -Dgles2=disabled \
            -Dglvnd=disabled -Dllvm=disabled -Dvalgrind=disabled \
            -Dgallium-drivers= -Dshared-glapi=disabled -Dzstd=disabled \
            -Dvulkan-drivers=wrapper

      - name: Compile wrapper ICD
        working-directory: wrapper-src
        run: meson compile -C _build

      - name: Validate stock-compatible wrapper binary
        run: |
          SO=wrapper-src/_build/src/vulkan/wrapper/libvulkan_wrapper.so
          test -s "$SO"
          file "$SO" | tee wrapper-file.txt
          file "$SO" | grep -q 'ARM aarch64'
          # Match the actual GameNative wrapper build contract. The wrapper's
          # entry points are generated/visibility-controlled by Mesa; requiring
          # arbitrary symbols in readelf -Ws caused a false CI failure even
          # though the upstream wrapper linked successfully.
          test -s wrapper-src/_build/src/vulkan/wrapper/wrapper_icd.json
          if readelf -d "$SO" | grep -E 'RPATH|RUNPATH'; then
            echo 'ERROR: wrapper contains RPATH/RUNPATH'
            exit 1
          fi

      - name: Stage flat GameNative 1.2.0 package
        run: |
          rm -rf package
          mkdir package
          cp wrapper-src/_build/src/vulkan/wrapper/libvulkan_wrapper.so package/
          cat > package/meta.json <<'JSON'
          {
            "name": "ExynosTools-Xclipse",
            "driverVersion": "stock-gamenative-1.2.0",
            "libraryName": "libvulkan_wrapper.so"
          }
          JSON
          cp wrapper-base.sha package/WRAPPER_BASE_SHA.txt
          sha256sum package/libvulkan_wrapper.so > package/SHA256SUMS.txt

          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('package')
          meta = json.loads((p / 'meta.json').read_text())
          assert meta['name'] == 'ExynosTools-Xclipse'
          assert meta['libraryName'] == 'libvulkan_wrapper.so'
          assert (p / meta['libraryName']).is_file()
          # Stock GameNative 1.2.0 cannot create nested directories while
          # extracting a custom driver ZIP, so every payload entry must be flat.
          assert all(x.is_file() for x in p.iterdir())
          PY

          # Build a local reference ZIP solely to validate the exact archive
          # shape stock GameNative expects. Do NOT upload this ZIP as the Actions
          # artifact, because Actions would wrap it in another ZIP.
          (cd package && zip -9 ../install-shape-test.zip meta.json libvulkan_wrapper.so WRAPPER_BASE_SHA.txt SHA256SUMS.txt)
          test "$(unzip -Z1 install-shape-test.zip | head -1)" = 'meta.json'
          test "$(unzip -Z1 install-shape-test.zip | grep -c '/')" = '0'
          unzip -p install-shape-test.zip meta.json | python -m json.tool >/dev/null

      - name: Upload directly installable GameNative ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          # GitHub creates the downloadable ZIP. Upload the package CONTENTS,
          # not an inner ZIP, so meta.json is at the root of the downloaded file.
          name: ExynosTools-Xclipse-GameNative-1.2.0-${{ github.sha }}
          path: |
            package/meta.json
            package/libvulkan_wrapper.so
            package/WRAPPER_BASE_SHA.txt
            package/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
