name: Build Stock GameNative 1.2.0 LSFG Wrapper WCP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-driver.yml'
      - 'ci/**'
      - 'src/**'
      - 'tests/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: stock-gamenative-lsfg-wrapper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wrapper-wcp:
    name: Stock GameNative 1.2.0 / LSFG / ARM64 Wrapper WCP
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout ExynosTools
        uses: actions/checkout@v4
        with:
          path: exynostools

      - name: Pin and verify stock GameNative v1.2.0
        run: |
          git clone --depth 1 --branch v1.2.0 https://github.com/utkarshdalal/GameNative.git gamenative-120
          GN_SHA=$(git -C gamenative-120 rev-parse HEAD)
          echo "$GN_SHA" | tee gamenative-120.sha
          test "$GN_SHA" = '3491226faedb7222a5f8b7248c0247957a060836'

          grep -q 'CONTENT_TYPE_WRAPPER("Wrapper")' \
            gamenative-120/app/src/main/java/com/winlator/contents/ContentProfile.java
          grep -q 'WRAPPER_TRUST_FILES' \
            gamenative-120/app/src/main/java/com/winlator/contents/ContentsManager.java
          grep -q 'v1.3.3-android-arm64-v8a' \
            gamenative-120/app/src/main/java/app/gamenative/utils/LsfgVkManager.kt
          grep -q 'LSFG_PROCESS' \
            gamenative-120/app/src/main/java/app/gamenative/utils/LsfgVkManager.kt
          grep -q 'LSFG_CONFIG' \
            gamenative-120/app/src/main/java/app/gamenative/utils/LsfgVkManager.kt
          grep -q 'VK_LAYER_PATH' \
            gamenative-120/app/src/main/java/app/gamenative/utils/LsfgVkManager.kt

      - name: Pin GameNative wrapper source
        run: |
          mkdir wrapper-src
          git -C wrapper-src init
          git -C wrapper-src remote add origin https://github.com/leegao/mesa-wrapper-CI.git
          git -C wrapper-src fetch --depth 1 origin 417776cc61eb137f0f22f24292f528d396c7189a
          git -C wrapper-src checkout --detach FETCH_HEAD
          WRAPPER_SHA=$(git -C wrapper-src rev-parse HEAD)
          echo "$WRAPPER_SHA" | tee wrapper-base.sha
          test "$WRAPPER_SHA" = '417776cc61eb137f0f22f24292f528d396c7189a'

      - name: Apply Android fixes and LSFG shared-device hardening
        run: |
          sed -i 's/#if defined(HAVE_MEMFD_CREATE) \&\& !defined __TERMUX__/#if defined(HAVE_MEMFD_CREATE)/' \
            wrapper-src/src/util/anon_file.c
          sed -i "s/dep_libudev = dependency('libudev', required : false)/dep_libudev = null_dep/g" \
            wrapper-src/meson.build
          python exynostools/ci/patch_gamenative_wrapper_lsfg.py wrapper-src

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mako PyYAML meson ninja packaging
          sudo apt-get update
          sudo apt-get install -y patchelf xz-utils

      - name: Generate Android cross file
        working-directory: wrapper-src
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export MESON_WORKING_DIR="$PWD"
          envsubst < android.toml > android-cross.toml
          CLANG_VER=$(basename "$(ls -d "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/linux-x86_64/lib/clang/* | sort -V | tail -1)")
          sed -i "s|lib/clang/18|lib/clang/$CLANG_VER|g" android-cross.toml

      - name: Configure single GameNative Wrapper ICD
        working-directory: wrapper-src
        run: |
          meson setup _build \
            --cross-file android-cross.toml \
            --prefix=/usr \
            --libdir=lib \
            -Dbuildtype=release \
            -Dplatforms=android,x11 \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dplatform-sdk-version=30 \
            -Dglx=disabled -Dgbm=disabled -Degl=disabled \
            -Dopengl=false -Dgles1=disabled -Dgles2=disabled \
            -Dglvnd=disabled -Dllvm=disabled -Dvalgrind=disabled \
            -Dgallium-drivers= -Dshared-glapi=disabled -Dzstd=disabled \
            -Dvulkan-drivers=wrapper

      - name: Compile Wrapper ICD
        working-directory: wrapper-src
        run: meson compile -C _build

      - name: Normalize and validate runtime linkage
        run: |
          set -euxo pipefail
          SO=wrapper-src/_build/src/vulkan/wrapper/libvulkan_wrapper.so
          ICD=wrapper-src/_build/src/vulkan/wrapper/wrapper_icd.aarch64.json
          ADRENO=$(find wrapper-src/_build -type f -name 'libadrenotools.so' -print -quit)

          test -s "$SO"
          test -s "$ICD"
          test -n "$ADRENO"
          test -s "$ADRENO"

          file "$SO" "$ADRENO" | tee wrapper-elf.txt
          file "$SO" | grep -q 'ARM aarch64'
          file "$ADRENO" | grep -q 'ARM aarch64'
          readelf -h "$SO" | grep -q 'Machine:.*AArch64'
          readelf -h "$ADRENO" | grep -q 'Machine:.*AArch64'

          readelf -d "$SO" | tee wrapper-dynamic-before.txt
          readelf -d "$ADRENO" | tee adrenotools-dynamic-before.txt

          # Both libraries are deployed side-by-side in /usr/lib by the WCP.
          # Remove Meson build-tree lookup paths without changing DT_NEEDED.
          patchelf --set-rpath '$ORIGIN' "$SO"
          patchelf --set-rpath '$ORIGIN' "$ADRENO"

          readelf -d "$SO" | tee wrapper-dynamic-final.txt
          readelf -d "$ADRENO" | tee adrenotools-dynamic-final.txt
          if cat wrapper-dynamic-final.txt adrenotools-dynamic-final.txt | \
              grep -E 'android_stub|subprojects|/home/runner|wrapper-src'; then
            echo 'ERROR: build-tree path leaked into runtime ELF'
            exit 1
          fi

          readelf -d "$SO" | grep -q 'Shared library: \[libadrenotools.so\]'
          readelf -Ws "$SO" | grep -q 'vk_icdGetInstanceProcAddr'
          readelf -Ws "$SO" | grep -q 'vk_icdNegotiateLoaderICDInterfaceVersion'

          # Prove the LSFG-safe shared-device guards made it into the final ELF.
          strings "$SO" | grep -q 'ExynosTools LSFG: preserving shared-device feature chain'
          strings "$SO" | grep -q 'ExynosTools LSFG: refusing NULL-pNext fallback'

          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('wrapper-src/_build/src/vulkan/wrapper/wrapper_icd.aarch64.json')
          data = json.loads(p.read_text())
          icd = data.get('ICD', data.get('icd', {}))
          path = icd.get('library_path') or icd.get('libraryPath')
          api = str(icd.get('api_version') or icd.get('apiVersion') or '')
          assert path == '/usr/lib/libvulkan_wrapper.so', (path, data)
          assert api.startswith('1.3'), (api, data)
          PY

          sha256sum "$SO" "$ADRENO" "$ICD" | tee runtime-sha256.txt

      - name: Stage minimal stock Wrapper WCP
        run: |
          set -euxo pipefail
          rm -rf wcp dist
          mkdir -p wcp dist
          SO=wrapper-src/_build/src/vulkan/wrapper/libvulkan_wrapper.so
          ICD=wrapper-src/_build/src/vulkan/wrapper/wrapper_icd.aarch64.json
          ADRENO=$(find wrapper-src/_build -type f -name 'libadrenotools.so' -print -quit)

          cp "$SO" wcp/libvulkan_wrapper.so
          cp "$ICD" wcp/wrapper_icd.aarch64.json
          cp "$ADRENO" wcp/libadrenotools.so

          cat > wcp/profile.json <<'JSON'
          {
            "type": "Wrapper",
            "versionName": "ExynosTools-LSFG",
            "versionCode": 2026082801,
            "description": "Pinned Xclipse-compatible Vulkan wrapper for stock GameNative 1.2.0 + LSFG v1.3.3. Preserves LSFG shared-device Vulkan feature state and forwards to the Android system Vulkan stack.",
            "files": [
              {
                "source": "libvulkan_wrapper.so",
                "target": "${libdir}/libvulkan_wrapper.so"
              },
              {
                "source": "wrapper_icd.aarch64.json",
                "target": "${sharedir}/vulkan/icd.d/wrapper_icd.aarch64.json"
              },
              {
                "source": "libadrenotools.so",
                "target": "${libdir}/libadrenotools.so"
              }
            ]
          }
          JSON

          # Explicit member names keep every WCP entry at archive root.
          (cd wcp && tar -cJf ../dist/ExynosTools-LSFG-GameNative-1.2.0.wcp \
            profile.json libvulkan_wrapper.so wrapper_icd.aarch64.json libadrenotools.so)

          cp wrapper-base.sha dist/WRAPPER_BASE_SHA.txt
          cp gamenative-120.sha dist/GAMENATIVE_BASE_SHA.txt
          sha256sum dist/ExynosTools-LSFG-GameNative-1.2.0.wcp > dist/SHA256SUMS.txt
          cat > dist/INSTALL.txt <<'TXT'
          Stock GameNative 1.2.0 installation:
          1. Import ExynosTools-LSFG-GameNative-1.2.0.wcp through GameNative's Contents Manager.
          2. In the Bionic container, select Graphics Driver: Wrapper-ExynosTools-LSFG.
          3. Set Graphics Driver Version: System.
          4. Keep Use AdrenoTools Turnip OFF.
          5. Enable LSFG in GameNative.
          6. Do not select the older ExynosTools-Xclipse / ExynosTools-Xclipse-v2 external driver packages.
          TXT

      - name: Validate stock GameNative WCP and LSFG contracts
        run: |
          set -euxo pipefail
          python exynostools/tests/gamenative_120_wcp_contract.py \
            gamenative-120 dist/ExynosTools-LSFG-GameNative-1.2.0.wcp

          test "$(tar -tJf dist/ExynosTools-LSFG-GameNative-1.2.0.wcp | head -1)" = 'profile.json'
          test "$(tar -tJf dist/ExynosTools-LSFG-GameNative-1.2.0.wcp | grep -c '/')" = '0'
          tar -xOJf dist/ExynosTools-LSFG-GameNative-1.2.0.wcp profile.json | python -m json.tool >/dev/null

          # WCP must contain exactly one wrapper, not an AdrenoTools custom-driver
          # meta.json and not a second nested archive.
          ! tar -tJf dist/ExynosTools-LSFG-GameNative-1.2.0.wcp | grep -q '^meta.json$'
          ! tar -tJf dist/ExynosTools-LSFG-GameNative-1.2.0.wcp | grep -E '\.(zip|wcp)$'

      - name: Upload stock GameNative Wrapper WCP
        uses: actions/upload-artifact@v4
        with:
          name: ExynosTools-LSFG-Stock-GameNative-1.2.0-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
