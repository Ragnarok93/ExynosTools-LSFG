name: Build Stock GameNative 1.2.0 Driver

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-driver.yml'
      - 'src/**'
      - 'tests/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: stock-gamenative-driver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wrapper:
    name: GameNative 1.2.0 / ARM64 wrapper ICD
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout ExynosTools
        uses: actions/checkout@v4
        with:
          path: exynostools

      - name: Verify stock GameNative 1.2.0 import contract
        run: |
          curl -fsSL https://raw.githubusercontent.com/utkarshdalal/GameNative/v1.2.0/app/src/main/java/com/winlator/contents/AdrenotoolsManager.java -o /tmp/AdrenotoolsManager.java
          grep -q 'new File(tmpDir, "meta.json")' /tmp/AdrenotoolsManager.java
          grep -q 'getString("libraryName")' /tmp/AdrenotoolsManager.java
          grep -q 'ADRENOTOOLS_DRIVER_NAME' /tmp/AdrenotoolsManager.java

      - name: Clone GameNative wrapper base
        run: |
          git clone --depth 1 --branch gn_wrapper2 https://github.com/leegao/mesa-wrapper-CI.git wrapper-src
          git -C wrapper-src rev-parse HEAD | tee wrapper-base.sha

      - name: Apply upstream Android build fixes
        working-directory: wrapper-src
        run: |
          sed -i 's/#if defined(HAVE_MEMFD_CREATE) \&\& !defined __TERMUX__/#if defined(HAVE_MEMFD_CREATE)/' src/util/anon_file.c
          sed -i "s/dep_libudev = dependency('libudev', required : false)/dep_libudev = null_dep/g" meson.build

      - name: Patch stock GameNative self-selected wrapper path
        working-directory: wrapper-src
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/vulkan/wrapper/wrapper_instance.c')
          s = p.read_text()
          old = '''   if (hooks && path && (stat(path, &sb) == 0)) {
      char *temp;
      asprintf(&temp, "%s%s", path, "temp");
      mkdir(temp, S_IRWXU | S_IRWXG);

      int flags = ADRENOTOOLS_DRIVER_CUSTOM;
      if (redirect_dir)
         flags |= ADRENOTOOLS_DRIVER_FILE_REDIRECT;
        
      return  adrenotools_open_libvulkan(RTLD_NOW, flags, temp, hooks, path, name, redirect_dir, NULL);
   }
   else
      return dlopen(DEFAULT_VULKAN_PATH, RTLD_NOW | RTLD_LOCAL);
'''
          new = '''   /* Stock GameNative's external-driver importer sets ADRENOTOOLS_DRIVER_* to
    * this wrapper itself. Passing those values back to adrenotools would make
    * the wrapper recursively load libvulkan_wrapper.so as its downstream ICD.
    * When we are the selected custom driver, bypass that recursion and forward
    * directly to Android's system Vulkan loader (Samsung Xclipse on target). */
   const bool self_selected = name && strcmp(name, "libvulkan_wrapper.so") == 0;
   if (self_selected) {
      WRAPPER_LOG(info, "ExynosTools: stock GameNative selected wrapper; forwarding to %s", DEFAULT_VULKAN_PATH);
      return dlopen(DEFAULT_VULKAN_PATH, RTLD_NOW | RTLD_LOCAL);
   }

   if (hooks && path && (stat(path, &sb) == 0)) {
      char *temp;
      asprintf(&temp, "%s%s", path, "temp");
      mkdir(temp, S_IRWXU | S_IRWXG);

      int flags = ADRENOTOOLS_DRIVER_CUSTOM;
      if (redirect_dir)
         flags |= ADRENOTOOLS_DRIVER_FILE_REDIRECT;
        
      return adrenotools_open_libvulkan(RTLD_NOW, flags, temp, hooks, path, name, redirect_dir, NULL);
   }

   return dlopen(DEFAULT_VULKAN_PATH, RTLD_NOW | RTLD_LOCAL);
'''
          if old not in s:
              raise SystemExit('wrapper_instance.c contract changed; refusing blind patch')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -q 'const bool self_selected' src/vulkan/wrapper/wrapper_instance.c
          grep -q 'forwarding to %s' src/vulkan/wrapper/wrapper_instance.c

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mako PyYAML meson ninja packaging
          sudo apt-get update
          sudo apt-get install -y patchelf

      - name: Generate Android cross file
        working-directory: wrapper-src
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export MESON_WORKING_DIR="$PWD"
          envsubst < android.toml > android-cross.toml
          CLANG_VER=$(basename "$(ls -d "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/linux-x86_64/lib/clang/* | sort -V | tail -1)")
          sed -i "s|lib/clang/18|lib/clang/$CLANG_VER|g" android-cross.toml

      - name: Configure wrapper ICD
        working-directory: wrapper-src
        run: |
          meson setup _build \
            --cross-file android-cross.toml \
            -Dbuildtype=release \
            -Dplatforms=android,x11 \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dplatform-sdk-version=30 \
            -Dglx=disabled -Dgbm=disabled -Degl=disabled \
            -Dopengl=false -Dgles1=disabled -Dgles2=disabled \
            -Dglvnd=disabled -Dllvm=disabled -Dvalgrind=disabled \
            -Dgallium-drivers= -Dshared-glapi=disabled -Dzstd=disabled \
            -Dvulkan-drivers=wrapper

      - name: Compile wrapper ICD
        working-directory: wrapper-src
        run: meson compile -C _build

      - name: Normalize and validate wrapper runtime linkage
        run: |
          SO=wrapper-src/_build/src/vulkan/wrapper/libvulkan_wrapper.so
          ADRENO=wrapper-src/_build/subprojects/libadrenotools/libadrenotools.so
          test -s "$SO"
          test -s "$ADRENO"
          file "$SO" | tee wrapper-file.txt
          file "$SO" | grep -q 'ARM aarch64'
          readelf -h "$SO" | grep -q 'Machine:.*AArch64'
          readelf -d "$SO" | tee wrapper-dynamic.txt

          if readelf -d "$SO" | grep -q 'libadrenotools.so'; then
            patchelf --set-rpath '$ORIGIN' "$SO"
          else
            patchelf --remove-rpath "$SO"
          fi

          if readelf -d "$SO" | grep -E 'android_stub|subprojects|/home/runner|wrapper-src'; then
            echo 'ERROR: build-tree path leaked into final wrapper'
            exit 1
          fi
          readelf -d "$SO" | tee wrapper-dynamic-final.txt
          readelf -Ws "$SO" | grep -q 'vk_icdGetInstanceProcAddr'
          readelf -Ws "$SO" | grep -q 'vk_icdNegotiateLoaderICDInterfaceVersion'
          strings "$SO" | grep -q 'stock GameNative selected wrapper'
          sha256sum "$SO" "$ADRENO" | tee wrapper-sha256.txt

      - name: Stage flat GameNative 1.2.0 package
        run: |
          rm -rf package install-shape-test.zip
          mkdir package
          SO=wrapper-src/_build/src/vulkan/wrapper/libvulkan_wrapper.so
          ADRENO=wrapper-src/_build/subprojects/libadrenotools/libadrenotools.so
          cp "$SO" package/
          if readelf -d "$SO" | grep -q 'libadrenotools.so'; then
            cp "$ADRENO" package/
          fi
          cat > package/meta.json <<'JSON'
          {
            "name": "ExynosTools-Xclipse-v2",
            "driverVersion": "stock-gamenative-1.2.0-system-icd",
            "libraryName": "libvulkan_wrapper.so"
          }
          JSON
          cp wrapper-base.sha package/WRAPPER_BASE_SHA.txt
          sha256sum package/*.so > package/SHA256SUMS.txt

          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('package')
          meta = json.loads((p / 'meta.json').read_text())
          assert set(meta) >= {'name', 'driverVersion', 'libraryName'}
          assert meta['name'] == 'ExynosTools-Xclipse-v2'
          assert meta['libraryName'] == 'libvulkan_wrapper.so'
          assert (p / meta['libraryName']).is_file()
          assert all(x.is_file() for x in p.iterdir())
          PY

          (cd package && zip -9 ../install-shape-test.zip meta.json *.so WRAPPER_BASE_SHA.txt SHA256SUMS.txt)
          test "$(unzip -Z1 install-shape-test.zip | head -1)" = 'meta.json'
          test "$(unzip -Z1 install-shape-test.zip | grep -c '/')" = '0'
          unzip -p install-shape-test.zip meta.json | python -m json.tool >/dev/null

      - name: Upload directly installable GameNative ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExynosTools-Xclipse-GameNative-1.2.0-${{ github.sha }}
          path: package/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
