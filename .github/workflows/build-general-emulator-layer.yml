name: Build General Emulator Vulkan Layer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-general-emulator-layer.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'shaders/**'
      - 'third_party/**'
      - 'VkLayer_vortek_xclipse.json'
      - 'meta.json'
      - 'scripts/package_emulator_driver.py'
      - 'tests/test_repository_product_boundaries.py'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: general-emulator-layer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-general-layer:
    name: ARM64 Vortek/ExynosTools layer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc ninja-build patchelf

      - name: Pin Vulkan build dependencies
        run: |
          rm -rf external/Vulkan-Headers external/Vulkan-Utility-Libraries
          git clone --depth 1 --branch v1.4.341 https://github.com/KhronosGroup/Vulkan-Headers.git external/Vulkan-Headers
          git clone --depth 1 --branch v1.4.341 https://github.com/KhronosGroup/Vulkan-Utility-Libraries.git external/Vulkan-Utility-Libraries
          test -f external/VulkanMemoryAllocator/include/vk_mem_alloc.h

      - name: Configure Android ARM64 layer
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DEXYNOS_LAYER_USE_SUBMODULE_DEPS=ON \
            -DEXYNOS_LAYER_USE_LOCAL_VULKAN_REPOS=OFF \
            -DEXYNOS_LAYER_BUILD_SHADERS=ON \
            -DEXYNOS_LAYER_EMBED_SHADERS=ON

      - name: Build repository Vulkan layer
        run: cmake --build build-android --target VkLayer_VortekXclipse -j2

      - name: Validate layer ABI and loader exports
        run: |
          SO=build-android/libVkLayer_VortekXclipse.so
          test -s "$SO"
          file "$SO"
          readelf -h "$SO" | grep -q 'Machine:.*AArch64'
          readelf -Ws "$SO" | grep -q 'vkGetInstanceProcAddr'
          readelf -Ws "$SO" | grep -q 'vkGetDeviceProcAddr'
          readelf -Ws "$SO" | grep -q 'vkNegotiateLoaderLayerInterfaceVersion'
          if readelf -d "$SO" | grep -E 'RPATH|RUNPATH'; then
            echo 'ERROR: non-portable RPATH/RUNPATH in general emulator layer'
            exit 1
          fi

      - name: Validate product-boundary contracts
        run: python -m unittest discover -s tests -p 'test_repository_product_boundaries.py' -v

      - name: Package layer-only CI artifact
        run: |
          python scripts/package_emulator_driver.py \
            --build-dir build-android \
            --layer-only \
            --output dist/ExynosTools-LSFG-General-Emulator-Layer.zip
          unzip -l dist/ExynosTools-LSFG-General-Emulator-Layer.zip

      - name: Upload general emulator layer
        uses: actions/upload-artifact@v4
        with:
          name: ExynosTools-LSFG-General-Emulator-Layer-${{ github.sha }}
          path: dist/ExynosTools-LSFG-General-Emulator-Layer.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
