name: LSFG GameNative Compatibility

on:
  push:
    branches: [work/lsfg-gamenative-v133, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contract-and-android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v1.3.3 migration on work branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/work/lsfg-gamenative-v133'
        run: |
          python tools/apply_gamenative_lsfg_v133.py
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/layer/layer_entry.cpp
            git commit -m 'Adapt BCn prewarm policy to GameNative LSFG v1.3.3'
            git push
          fi

      - name: Fetch current GameNative LSFG contract
        run: |
          git clone --depth 1 --branch release https://github.com/GameNative/lsfg-vk-android.git /tmp/lsfg-vk-android
          git clone --depth 1 https://github.com/utkarshdalal/GameNative.git /tmp/GameNative

      - name: Verify source contracts
        run: |
          python tests/lsfg_compat_contract.py \
            --repo . \
            --lsfg-root /tmp/lsfg-vk-android \
            --manager /tmp/GameNative/app/src/main/java/app/gamenative/utils/LsfgVkManager.kt

      - name: Install Android build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf glslc
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/Vulkan-Headers
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Utility-Libraries.git /tmp/Vulkan-Utility-Libraries

      - name: Configure Android ARM64 layer
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-35 \
            -DCMAKE_BUILD_TYPE=Release \
            -DEXYNOS_LAYER_USE_LOCAL_VULKAN_REPOS=OFF \
            -DEXYNOS_LAYER_USE_SUBMODULE_DEPS=OFF \
            -DEXYNOS_VULKAN_HEADERS_PATH=/tmp/Vulkan-Headers \
            -DEXYNOS_VULKAN_UTILITY_INCLUDE_DIR=/tmp/Vulkan-Utility-Libraries/include \
            -DEXYNOS_VULKAN_UTILITY_SRC_DIR=/tmp/Vulkan-Utility-Libraries/src/vulkan

      - name: Build Android ARM64 layer
        run: cmake --build build-ci --parallel 4

      - name: Verify Android artifact
        run: |
          test -s build-ci/libVkLayer_VortekXclipse.so
          file build-ci/libVkLayer_VortekXclipse.so | grep -q 'ARM aarch64'
          if readelf -d build-ci/libVkLayer_VortekXclipse.so | grep -E 'RPATH|RUNPATH'; then
            echo 'Android artifact contains forbidden RPATH/RUNPATH'
            exit 1
          fi
          readelf -Ws build-ci/libVkLayer_VortekXclipse.so | grep -q 'vkNegotiateLoaderLayerInterfaceVersion'
          readelf -Ws build-ci/libVkLayer_VortekXclipse.so | grep -q 'vkGetInstanceProcAddr'
          readelf -Ws build-ci/libVkLayer_VortekXclipse.so | grep -q 'vkGetDeviceProcAddr'
