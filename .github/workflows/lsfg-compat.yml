name: Stock GameNative 1.2.0 Driver Compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GAMENATIVE_120_SHA: 3491226faedb7222a5f8b7248c0247957a060836

jobs:
  contract-and-android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact stock GameNative 1.2.0 source
        run: |
          git init /tmp/GameNative
          git -C /tmp/GameNative remote add origin https://github.com/utkarshdalal/GameNative.git
          git -C /tmp/GameNative fetch --depth 1 origin "$GAMENATIVE_120_SHA"
          git -C /tmp/GameNative checkout --detach FETCH_HEAD
          test "$(git -C /tmp/GameNative rev-parse HEAD)" = "$GAMENATIVE_120_SHA"

      - name: Test pinned GameNative contract CLI
        run: python -m unittest discover -s tests -p 'test_lsfg_compat_contract_cli.py' -v

      - name: Verify stock GameNative and ExynosTools source contracts
        run: |
          python tests/lsfg_compat_contract.py \
            --repo . \
            --gamenative-root /tmp/GameNative
          python tests/gamenative_120_stock_wrapper_contract.py /tmp/GameNative

      - name: Verify LSFG environment state machine
        run: |
          cat >/tmp/lsfg_compat_test.cpp <<'CPP'
          #include <cstdlib>
          #include "layer_lsfg_compat.h"
          int main() {
            unsetenv("LSFG_PROCESS"); unsetenv("LSFG_CONFIG");
            if (exynos_lsfg_process_active()) return 1;
            setenv("LSFG_PROCESS", "gamenative-lsfg", 1);
            if (exynos_lsfg_process_active()) return 2;
            setenv("LSFG_CONFIG", "/tmp/conf.toml", 1);
            if (!exynos_lsfg_process_active()) return 3;
            const auto s = snapshot_lsfg_compat();
            return (s.enabled && s.process_environment_present) ? 0 : 4;
          }
          CPP
          c++ -std=c++17 -Wall -Wextra -Werror -Isrc/layer \
            src/layer/layer_lsfg_compat.cpp /tmp/lsfg_compat_test.cpp -o /tmp/lsfg_compat_test
          /tmp/lsfg_compat_test

      - name: Install Android build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf glslc zip
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/Vulkan-Headers
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Utility-Libraries.git /tmp/Vulkan-Utility-Libraries

      - name: Configure Android ARM64 compatibility layer
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-35 \
            -DCMAKE_BUILD_TYPE=Release \
            -DEXYNOS_LAYER_USE_LOCAL_VULKAN_REPOS=OFF \
            -DEXYNOS_LAYER_USE_SUBMODULE_DEPS=OFF \
            -DEXYNOS_VULKAN_HEADERS_PATH=/tmp/Vulkan-Headers \
            -DEXYNOS_VULKAN_UTILITY_INCLUDE_DIR=/tmp/Vulkan-Utility-Libraries/include \
            -DEXYNOS_VULKAN_UTILITY_SRC_DIR=/tmp/Vulkan-Utility-Libraries/src/vulkan

      - name: Build Android ARM64 compatibility layer
        run: cmake --build build-ci --parallel 4

      - name: Configure stock-Wrapper driver shim
        run: |
          cmake -S src/driver -B build-gamenative-shim -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-35 \
            -DCMAKE_BUILD_TYPE=Release \
            -DEXYNOS_ROOT="$GITHUB_WORKSPACE" \
            -DEXYNOS_VULKAN_HEADERS_PATH=/tmp/Vulkan-Headers

      - name: Build stock-Wrapper driver shim
        run: cmake --build build-gamenative-shim --parallel 4

      - name: Verify ARM64 artifacts
        run: |
          set -euxo pipefail
          LAYER=build-ci/libVkLayer_VortekXclipse.so
          SHIM=build-gamenative-shim/libvulkan_exynostools.so
          test -s "$LAYER"
          test -s "$SHIM"
          file "$LAYER" "$SHIM" | tee /tmp/exynostools-elf.txt
          file "$LAYER" | grep -q 'ARM aarch64'
          file "$SHIM" | grep -q 'ARM aarch64'
          ! readelf -d "$LAYER" | grep -E 'RPATH|RUNPATH'
          ! readelf -d "$SHIM" | grep -E 'RPATH|RUNPATH'
          readelf -Ws "$LAYER" | grep -q 'vkNegotiateLoaderLayerInterfaceVersion'
          readelf -Ws "$LAYER" | grep -q 'vkGetInstanceProcAddr'
          readelf -Ws "$LAYER" | grep -q 'vkGetDeviceProcAddr'
          readelf -Ws "$SHIM" | grep -q 'vkCreateInstance'
          readelf -Ws "$SHIM" | grep -q 'vkCreateDevice'
          readelf -Ws "$SHIM" | grep -q 'vkGetInstanceProcAddr'
          readelf -Ws "$SHIM" | grep -q 'vkGetDeviceProcAddr'
          readelf -Ws "$SHIM" | grep -q 'vk_icdGetInstanceProcAddr'
          readelf -Ws "$SHIM" | grep -q 'vk_icdGetPhysicalDeviceProcAddr'
          readelf -Ws "$SHIM" | grep -q 'vk_icdNegotiateLoaderICDInterfaceVersion'
          strings "$SHIM" | grep -q '/system/lib64/libvulkan.so'
          strings "$SHIM" | grep -q 'ADRENOTOOLS_DRIVER_PATH'
          strings "$SHIM" | grep -q 'libVkLayer_VortekXclipse.so'
          strings "$SHIM" | grep -q 'ExynosToolsShim'

      - name: Package GameNative custom driver ZIP
        run: |
          rm -rf dist stage-driver
          mkdir -p dist stage-driver
          cp meta.json stage-driver/meta.json
          cp build-gamenative-shim/libvulkan_exynostools.so stage-driver/
          cp build-ci/libVkLayer_VortekXclipse.so stage-driver/
          cp VkLayer_vortek_xclipse.json stage-driver/
          (cd stage-driver && zip -9 ../dist/ExynosTools-LSFG-GameNative-1.2.0-r2.zip \
            meta.json libvulkan_exynostools.so libVkLayer_VortekXclipse.so VkLayer_vortek_xclipse.json)
          sha256sum dist/ExynosTools-LSFG-GameNative-1.2.0-r2.zip > dist/SHA256SUMS.txt

      - name: Verify packaged driver against untouched GameNative 1.2.0
        run: |
          python tests/gamenative_120_stock_wrapper_contract.py \
            /tmp/GameNative dist/ExynosTools-LSFG-GameNative-1.2.0-r2.zip
          ! unzip -l dist/ExynosTools-LSFG-GameNative-1.2.0-r2.zip | grep -q 'libvulkan_wrapper.so'
          ! unzip -l dist/ExynosTools-LSFG-GameNative-1.2.0-r2.zip | grep -q 'profile.json'

      - name: Upload GameNative custom-driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExynosTools-LSFG-GameNative-1.2.0-r2-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
